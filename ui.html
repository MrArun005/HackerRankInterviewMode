<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<style>
  :root{
    --bg:#faf9f5; --panel:#ffffff; --panel2:#f5f3ee; --line:#e6e3da;
    --fg:#1f1e1d; --muted:#6b6862; --accent:#c96442; --accent-soft:#f2e6e0;
    --agent:#8a6f4e; --pass:#3f7d5c; --fail:#b3482f;
    --serif:"Fraunces",ui-serif,Georgia,serif;
    --sans:"Inter",ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    --shadow:0 1px 2px rgba(31,30,29,.05), 0 1px 12px rgba(31,30,29,.03);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1f1e1d; --panel:#262624; --panel2:#2f2e2c; --line:#3a3936;
      --fg:#f0eee6; --muted:#9a968d; --accent:#d97757; --accent-soft:#3a2b24;
      --agent:#c3a37a; --pass:#6cc39a; --fail:#e08a72;
      --shadow:0 1px 2px rgba(0,0,0,.2), 0 1px 12px rgba(0,0,0,.14);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1f1e1d; --panel:#262624; --panel2:#2f2e2c; --line:#3a3936;
    --fg:#f0eee6; --muted:#9a968d; --accent:#d97757; --accent-soft:#3a2b24;
    --agent:#c3a37a; --pass:#6cc39a; --fail:#e08a72;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 1px 12px rgba(0,0,0,.14);
  }
  *{box-sizing:border-box}
  :focus-visible:not(textarea){outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 var(--sans);
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- top ---------- */
  .top{
    min-height:52px; flex:0 0 auto; display:flex; align-items:center; gap:13px;
    flex-wrap:wrap; padding:6px 20px; border-bottom:1px solid var(--line); background:var(--bg);
  }
  @media (max-width:820px){ .kbdHint{display:none} }
  .mark{
    width:22px;height:22px;flex:0 0 auto;border-radius:6px;background:var(--accent);
    display:grid;place-items:center;color:#fff;font:600 12px/1 var(--sans);
  }
  .title{font:500 17px/1 var(--serif);letter-spacing:-.01em}
  .file{
    color:var(--muted);font-family:var(--mono);font-size:12px;
    background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:3px 8px;
  }
  .spacer{flex:1}
  .probs{display:flex;gap:4px;align-items:center}
  .probs button{
    background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;
    padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer;transition:.13s;
    display:flex;align-items:center;gap:7px
  }
  .probs button:hover{color:var(--fg);border-color:var(--accent)}
  .probs button[aria-current="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .probs .num{font-family:var(--mono);font-size:11px;opacity:.65}
  .themeBtn{
    background:var(--panel);border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer;
    display:flex;align-items:center;gap:6px;transition:.13s
  }
  .themeBtn:hover{color:var(--fg);border-color:var(--accent)}
  .themeBtn .ico{font-size:13px;line-height:1}
  .probs .badge{
    font-family:var(--mono);font-size:10px;background:var(--panel2);border-radius:999px;
    padding:0 5px;color:var(--muted)
  }
  .ticket{
    height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);padding:26px 30px
  }
  .ticket .inner{max-width:74ch}
  .ticket h1{font:500 24px/1.25 var(--serif);margin:0 0 18px;letter-spacing:-.015em}
  .ticket h2{font:500 16px/1.3 var(--serif);margin:24px 0 10px}
  .ticket p{margin:0 0 12px}
  .ticket ul,.ticket ol{margin:0 0 12px;padding-left:22px}
  .ticket li{margin:5px 0}
  .ticket code{font-family:var(--mono);font-size:13px;background:var(--panel2);
               border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .ticket pre{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
              padding:14px 16px;overflow-x:auto;margin:0 0 12px}
  .ticket pre code{background:none;border:0;padding:0;font-size:12.5px}
  .ticket blockquote{margin:16px 0 0;padding:10px 16px;border-left:2px solid var(--accent);
                     background:var(--accent-soft);border-radius:0 8px 8px 0;color:var(--fg)}
  .ticket blockquote p{margin:0}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.5}
  .dot.busy{background:var(--accent);opacity:1;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.3}}
  .hint{color:var(--muted);font-size:12.5px}
  kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;
      border-radius:5px;padding:1px 5px;color:var(--muted);background:var(--panel)}
  /* ---------- layout ---------- */
  .wrap{flex:1;display:grid;grid-template-columns:minmax(400px,36%) 1fr;min-height:0}
  @media (max-width:980px){.wrap{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
  .chat{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
  .work{display:flex;flex-direction:column;min-height:0;background:var(--panel2)}
  /* ---------- chat ---------- */
  .log{flex:1;overflow-y:auto;padding:26px 24px 10px;scroll-behavior:smooth}
  .msg{margin-bottom:26px;max-width:62ch;overflow-wrap:anywhere}
  .who{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .who b{font:500 13px/1 var(--sans);letter-spacing:.01em}
  .pill{
    border-radius:999px;padding:2px 9px;font-size:10.5px;letter-spacing:.07em;
    text-transform:uppercase;font-weight:500;border:1px solid transparent
  }
  .pill.plan{color:var(--accent);background:var(--accent-soft)}
  .pill.agent{color:var(--agent);border-color:var(--line);background:var(--panel2)}
  .msg.user .body{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:13px 16px;white-space:pre-wrap;box-shadow:var(--shadow)
  }
  .body p{margin:0 0 11px}.body p:last-child{margin-bottom:0}
  .body ul,.body ol{margin:0 0 11px;padding-left:22px}
  .body li{margin:4px 0}
  .body code{font-family:var(--mono);font-size:13px;background:var(--panel2);
             border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .body pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;
            padding:14px 16px;overflow-x:auto;margin:0 0 12px;box-shadow:var(--shadow)}
  .body pre code{background:none;border:0;padding:0;font-size:12.5px;line-height:1.6}
  .body h2,.body h3{font:500 16px/1.3 var(--serif);margin:20px 0 9px;letter-spacing:-.01em}
  .body table{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:13.5px}
  .body th,.body td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left}
  .body th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .body blockquote{margin:0 0 11px;padding:2px 0 2px 14px;border-left:2px solid var(--accent);color:var(--muted)}
  .thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
  .thinking i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block;animation:b 1.3s infinite}
  .thinking i:nth-child(2){animation-delay:.18s}.thinking i:nth-child(3){animation-delay:.36s}
  @keyframes b{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  .empty{color:var(--muted);font-size:14px;padding:10px 2px;max-width:46ch}
  .empty b{display:block;font:500 19px/1.35 var(--serif);color:var(--fg);margin-bottom:7px;letter-spacing:-.01em}
  /* ---------- composer ---------- */
  .composer{flex:0 0 auto;padding:14px 20px 20px}
  .box{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px 10px;box-shadow:var(--shadow);transition:border-color .15s
  }
  .box:focus-within{border-color:var(--accent)}
  textarea{
    width:100%;min-height:52px;max-height:230px;resize:none;display:block;
    background:none;border:0;color:var(--fg);font:inherit;outline:none;padding:0
  }
  textarea::placeholder{color:var(--muted)}
  .bar{display:flex;align-items:center;gap:7px;margin-top:10px}
  .modes{display:flex;gap:5px}
  .modes button{
    background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;
    padding:4px 13px;font:inherit;font-size:12.5px;cursor:pointer;transition:.13s
  }
  .modes button:hover{color:var(--fg)}
  .modes button.p[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .modes button.a[aria-pressed="true"]{color:var(--agent);border-color:var(--agent);background:var(--panel2)}
  .send{
    margin-left:auto;background:var(--accent);border:0;color:#fff;font:inherit;font-weight:500;
    border-radius:9px;padding:7px 15px;cursor:pointer;transition:.13s
  }
  .send:hover{filter:brightness(1.06)}
  .send:disabled{opacity:.35;cursor:not-allowed;filter:none}
  /* ---------- work ---------- */
  .tabs{flex:0 0 auto;display:flex;align-items:center;gap:3px;padding:0 14px;
        border-bottom:1px solid var(--line);background:var(--bg)}
  .tabs button{
    background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
    font:inherit;font-size:13.5px;padding:15px 13px;cursor:pointer;transition:.13s
  }
  .tabs button:hover{color:var(--fg)}
  .tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
  .tabs .grow{flex:1}
  .ghost{color:var(--muted);font-size:12.5px;border:1px solid var(--line)!important;
         border-radius:7px;padding:5px 11px!important;background:var(--panel)!important}
  .pane{flex:1;min-height:0;position:relative;padding:14px}
  .frameWrap{height:100%;border:1px solid var(--line);border-radius:12px;overflow:hidden;
             background:#fff;box-shadow:var(--shadow)}
  iframe{width:100%;height:100%;border:0;display:block}
  /* ---------- source viewer ---------- */
  /* ---------- diff ---------- */
  .diffWrap{height:100%;display:grid;grid-template-columns:190px 1fr;gap:14px}
  @media (max-width:1180px){.diffWrap{grid-template-columns:150px 1fr}}
  .diffStat{font-family:var(--mono);font-size:12px}
  .diffStat .plus{color:var(--pass)} .diffStat .minus{color:var(--fail)}
  .difftable{border-collapse:collapse;width:100%;font-family:var(--mono);
             font-size:12.5px;line-height:1.65}
  .difftable td.tx{padding:0 16px;white-space:pre;border:0}
  .difftable tr.add td{background:color-mix(in srgb,var(--pass) 14%,transparent);color:var(--fg)}
  .difftable tr.del td{background:color-mix(in srgb,var(--fail) 14%,transparent);color:var(--fg)}
  .difftable tr.hunk td{color:var(--accent);background:var(--panel2)}
  .difftable tr.meta td{color:var(--muted);opacity:.7}
  .none{color:var(--muted);padding:18px 20px;margin:0;font-size:13.5px}
  .lockPill{
    border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);
    border-radius:999px;padding:2px 9px;font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;font-weight:500
  }
  .srcWrap{height:100%;display:grid;grid-template-columns:190px 1fr;gap:14px}
  @media (max-width:1180px){.srcWrap{grid-template-columns:150px 1fr}}
  .rail{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px;overflow-y:auto;box-shadow:var(--shadow)
  }
  .rail h4{
    font:500 10.5px/1 var(--sans);text-transform:uppercase;letter-spacing:.09em;
    color:var(--muted);margin:6px 8px 9px
  }
  .rail button{
    display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;
    color:var(--muted);font:inherit;font-size:13px;padding:7px 9px;cursor:pointer;
    transition:.12s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  .rail button:hover{background:var(--panel2);color:var(--fg)}
  .rail button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
  .rail .n{float:right;font-family:var(--mono);font-size:11px;opacity:.6;font-weight:400}
  .srcMain{
    position:relative;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column
  }
  .srcBar{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:9px 12px;
    border-bottom:1px solid var(--line);background:var(--panel2)
  }
  .srcBar .lbl{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .srcBar .ro{
    font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fail);
    border:1px solid currentColor;border-radius:999px;padding:1px 8px;opacity:.8
  }
  .srcBar .grow{flex:1}
  .copy{
    background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:7px;
    padding:4px 11px;font:inherit;font-size:12px;cursor:pointer;transition:.12s
  }
  .copy:hover{color:var(--fg);border-color:var(--accent)}
  .code{flex:1;overflow:auto;padding:14px 0}
  .code table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px;line-height:1.7}
  .code td{padding:0;border:0;vertical-align:top}
  .code td.ln{
    width:1%;white-space:nowrap;text-align:right;padding:0 14px 0 16px;
    color:var(--muted);opacity:.45;user-select:none
  }
  .code td.tx{padding-right:18px;white-space:pre;color:var(--fg)}
  .code tr:hover td.tx{background:var(--panel2)}
  /* highlight.js tokens, mapped to the Claude palette */
  .hljs-keyword,.hljs-selector-tag,.hljs-literal{color:#a3568f}
  .hljs-string,.hljs-regexp{color:#3f7d5c}
  .hljs-title,.hljs-title.function_,.hljs-name{color:#2f6f9f}
  .hljs-attr,.hljs-attribute,.hljs-variable,.hljs-template-variable{color:#b3703a}
  .hljs-number,.hljs-symbol{color:#8a5cc4}
  .hljs-comment,.hljs-quote{color:var(--muted);font-style:italic}
  .hljs-built_in,.hljs-type{color:#c96442}
  .hljs-tag{color:var(--muted)}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .hljs-keyword,
    :root:not([data-theme="light"]) .hljs-selector-tag,
    :root:not([data-theme="light"]) .hljs-literal{color:#d99bc4}
    :root:not([data-theme="light"]) .hljs-string,
    :root:not([data-theme="light"]) .hljs-regexp{color:#8ecfa8}
    :root:not([data-theme="light"]) .hljs-title,
    :root:not([data-theme="light"]) .hljs-title.function_,
    :root:not([data-theme="light"]) .hljs-name{color:#84b8e0}
    :root:not([data-theme="light"]) .hljs-attr,
    :root:not([data-theme="light"]) .hljs-attribute,
    :root:not([data-theme="light"]) .hljs-variable{color:#e0a86a}
    :root:not([data-theme="light"]) .hljs-number,
    :root:not([data-theme="light"]) .hljs-symbol{color:#bb9af7}
    :root:not([data-theme="light"]) .hljs-built_in,
    :root:not([data-theme="light"]) .hljs-type{color:#e08a72}
  }
  .hidden{display:none!important}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:3px solid transparent;background-clip:content-box}
</style>
</head>
<body>
<div class="top">
  <span class="mark">✳</span>
  <span class="title">Agent Editor</span>
  <span class="probs" id="probs"></span>
  <span class="spacer"></span>
  <span class="file" id="fname">app.html</span>
  <span class="lockPill hidden" id="lock" title="Plan mode: the workspace file is read-only on disk">locked</span>
  <button class="themeBtn" id="theme" title="Theme: light / dark / system"></button>
  <span class="dot" id="dot"></span>
  <span class="hint" id="status" role="status" aria-live="polite">idle</span>
  <button class="themeBtn hidden" id="unstick" title="Clear a turn that never got a reply">Unstick</button>
  <span class="hint kbdHint" style="margin-left:10px"><kbd>↵</kbd> send <kbd>⇧↵</kbd> newline</span>
</div>

<div class="wrap">
  <div class="chat">
    <div class="log" id="log"></div>
    <div class="composer">
      <div class="box">
        <textarea id="input" rows="2" placeholder="Ask for a plan. No files will be changed…"></textarea>
        <div class="bar">
          <div class="modes">
            <button class="p" id="mPlan" aria-pressed="true">Plan</button>
            <button class="a" id="mAgent" aria-pressed="false">Agent</button>
          </div>
          <button class="send" id="send">Send</button>
        </div>
      </div>
    </div>
  </div>

  <div class="work">
    <div class="tabs" role="tablist" aria-label="Workspace">
      <button id="tPrev" role="tab" aria-selected="true"  aria-controls="frameWrap" tabindex="0">Preview &amp; Tests</button>
      <button id="tCode" role="tab" aria-selected="false" aria-controls="srcWrap"   tabindex="-1">Source</button>
      <button id="tDiff" role="tab" aria-selected="false" aria-controls="diff"      tabindex="-1">Diff</button>
      <button id="tTick" role="tab" aria-selected="false" aria-controls="ticket"    tabindex="-1">Problem</button>
      <span class="grow"></span>
      <button class="ghost" id="reload">Reload</button>
    </div>
    <div class="pane">
      <div class="frameWrap" id="frameWrap" role="tabpanel" aria-labelledby="tPrev"><iframe id="frame" src="/app.html" sandbox="allow-scripts"></iframe></div>
      <div class="srcWrap hidden" id="srcWrap" role="tabpanel" aria-labelledby="tCode">
        <div class="rail">
          <h4>app.html</h4>
          <div id="rail"></div>
        </div>
        <div class="srcMain">
          <div class="srcBar">
            <span class="lbl" id="srcLbl">—</span>
            <span class="ro hidden" id="srcRo">read only</span>
            <span class="grow"></span>
            <button class="copy" id="copy">Copy</button>
          </div>
          <div class="code" id="code"></div>
        </div>
      </div>
      <div class="diffWrap hidden" id="diff" role="tabpanel" aria-labelledby="tDiff">
        <div class="rail" id="histRail"></div>
        <div class="srcMain">
          <div class="srcBar">
            <span class="lbl" id="diffLbl">—</span>
            <span class="diffStat" id="diffStat"></span>
            <span class="grow"></span>
          </div>
          <div class="code" id="diffBody"></div>
        </div>
      </div>
      <div class="ticket hidden" id="ticket" role="tabpanel" aria-labelledby="tTick"><div class="inner" id="ticketBody"></div></div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let mode="plan", lastSig="", lastVersion=-1, pending=false, stalled=false;
marked.setOptions({breaks:true});

const EMPTY = '<div class="empty"><b>Nothing yet.</b>'
  + 'Pick <em>Plan</em> to think through a change without touching files, '
  + 'or <em>Agent</em> to have it written. The pane on the right shows the app and its tests.</div>';

function setMode(m){
  mode=m;
  $("mPlan").setAttribute("aria-pressed", m==="plan");
  $("mAgent").setAttribute("aria-pressed", m==="agent");
  $("input").placeholder = m==="plan"
    ? "Ask for a plan. No files will be changed…"
    : "Describe what to build. Files will be written…";
}
$("mPlan").onclick=()=>setMode("plan");
$("mAgent").onclick=()=>setMode("agent");

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function render(state){
  const log=$("log");
  const last = state.messages[state.messages.length-1];
  // signature, not just a count - an edited last message has the same count
  const sig = state.messages.length+":"+(last?last.ts:0)+":"+(last?last.text.length:0);
  const changed = sig!==lastSig || state.pending!==pending || !!state.stalled!==stalled;
  pending=state.pending; stalled=!!state.stalled;
  $("dot").className="dot"+(pending?" busy":"");
  $("status").textContent = stalled ? "no reply" : pending ? "working" : "idle";
  $("send").disabled=pending;
  $("unstick").classList.toggle("hidden", !pending);
  if(!changed) return;
  lastSig=sig;

  const atBottom = log.scrollHeight-log.scrollTop-log.clientHeight < 140;
  log.innerHTML = state.messages.length ? "" : EMPTY;
  for(const m of state.messages){
    const d=document.createElement("div");
    d.className="msg "+m.role;
    const md = escapeHtml(String(m.mode||"plan"));
    d.innerHTML='<div class="who"><b>'+(m.role==="user"?"You":"Claude")+'</b>'
      +'<span class="pill '+md+'">'+md+'</span></div>'
      +'<div class="body">'+(m.role==="user"?escapeHtml(m.text):marked.parse(m.text))+'</div>';
    log.appendChild(d);
  }
  if(pending){
    const t=document.createElement("div");
    t.className="msg";
    t.innerHTML='<div class="who"><b>Claude</b></div>'
      +'<div class="thinking"><i></i><i></i><i></i><span>thinking</span></div>';
    log.appendChild(t);
  }
  if(atBottom) log.scrollTop=log.scrollHeight;
}

async function refresh(){
  const s=await (await fetch("/api/state",{cache:"no-store"})).json();
  const switched = s.current!==CURRENT;
  if(switched){
    CURRENT=s.current; lastSig=""; lastVersion=-1; sel=null;
    reloadFrame();
    if(!$("ticket").classList.contains("hidden")) loadTicket();
  }
  paintProblems(s.problems||[], s.current);
  render(s);
  if(s.fileVersion!==lastVersion){
    if(lastVersion!==-1){
      reloadFrame();
      if(srcOpen()) loadSource(true);
      if(!$("diff").classList.contains("hidden")) loadDiff("");   // show the change just made
    }
    lastVersion=s.fileVersion;
  }
  $("fname").textContent=s.file||"app.html";
  $("lock").classList.toggle("hidden", !s.locked);
  return s;
}

let pollDelay=700;
async function poll(){
  try{ await refresh(); pollDelay=700; }
  catch(e){
    $("status").textContent="server offline"; $("dot").className="dot";
    pollDelay=Math.min(pollDelay*2,10000);          // stop hammering a dead server
  }
  setTimeout(poll, document.hidden ? Math.max(pollDelay,5000) : pollDelay);
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refresh().catch(()=>{}); });

$("unstick").onclick=async()=>{
  await fetch("/api/unstick",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
  lastSig=""; refresh().catch(()=>{});
};
function reloadFrame(){ $("frame").src="/app.html?theme="+theme+"&t="+Date.now(); }
$("reload").onclick=()=>{reloadFrame(); if(srcOpen()) loadSource(true);};

async function send(){
  const t=$("input").value.trim();
  if(!t||pending) return;
  $("input").value=""; autosize();
  await fetch("/api/send",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({mode,text:t})});
}
$("send").onclick=send;
$("input").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}
});
function autosize(){const t=$("input");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,230)+"px";}
$("input").addEventListener("input",autosize);

/* ---------- source viewer ---------- */
let SRC="", REGIONS=[], sel=null;

async function loadSource(keep){
  const r=await (await fetch("/api/source",{cache:"no-store"})).json();
  SRC=r.source||"";
  REGIONS=(r.regions||[]).concat([{name:"Whole file",start:0,end:SRC.split("\n").length}]);
  if(sel===null||!keep||sel>=REGIONS.length) sel=pickDefault();
  paintRail(); paintCode();
}

// default to the editable region, not the 200 lines of CSS above it
function pickDefault(){
  const i=REGIONS.findIndex(r=>/your code/i.test(r.name));
  return i>=0?i:0;
}

function paintRail(){
  const rail=$("rail"); rail.innerHTML="";
  REGIONS.forEach((r,i)=>{
    const b=document.createElement("button");
    b.setAttribute("aria-current", i===sel);
    b.innerHTML=short(r.name)+'<span class="n">'+(r.end-r.start)+'</span>';
    b.title=r.name;
    b.onclick=()=>{sel=i;paintRail();paintCode();};
    rail.appendChild(b);
  });
}

function short(n){
  return n.replace(/\s*[—-]\s*.*$/,"")       // drop the trailing explanation
          .replace(/\bREAD ONLY\b/i,"").trim() || n;
}

function paintCode(){
  const r=REGIONS[sel]; if(!r) return;
  const lines=SRC.split("\n").slice(r.start,r.end);
  const text=lines.join("\n");
  const lang=/tests|your code|seed/i.test(r.name)?"javascript":"xml";

  let html;
  try{ html=hljs.highlight(text,{language:lang,ignoreIllegals:true}).value; }
  catch(e){ html=escapeHtml(text); }

  // split the highlighted markup per line, reopening spans that cross lines
  const rows=[]; const open=[];
  html.split("\n").forEach((ln,i)=>{
    const prefix=open.map(o=>'<span class="'+o+'">').join("");
    const re=/<span class="([^"]+)">|<\/span>/g; let m;
    while((m=re.exec(ln))!==null){ m[1]?open.push(m[1]):open.pop(); }
    const suffix="</span>".repeat(open.length);
    rows.push('<tr><td class="ln">'+(r.start+i+1)+'</td><td class="tx">'
      +prefix+ln+suffix+'</td></tr>');
  });

  $("code").innerHTML='<table>'+rows.join("")+'</table>';
  $("srcLbl").textContent=r.name;
  $("srcRo").classList.toggle("hidden", !/read only/i.test(r.name));
  $("code").scrollTop=0;
}

$("copy").onclick=async()=>{
  const r=REGIONS[sel];
  await navigator.clipboard.writeText(SRC.split("\n").slice(r.start,r.end).join("\n"));
  $("copy").textContent="Copied"; setTimeout(()=>$("copy").textContent="Copy",1200);
};

const PANES={tPrev:"frameWrap", tCode:"srcWrap", tDiff:"diff", tTick:"ticket"};
const srcOpen=()=>!$("srcWrap").classList.contains("hidden");

function showTab(id){
  for(const [btn,pane] of Object.entries(PANES)){
    $(btn).setAttribute("aria-selected", btn===id);
    $(btn).tabIndex = btn===id ? 0 : -1;            // roving tabindex
    $(pane).classList.toggle("hidden", btn!==id);
  }
  if(id==="tCode") loadSource(true);
  if(id==="tDiff") loadDiff();
  if(id==="tTick") loadTicket();
}
const TABIDS=Object.keys(PANES);
TABIDS.forEach(id=>{ $(id).onclick=()=>showTab(id); });
TABIDS.forEach((id,i)=>{
  $(id).addEventListener("keydown",e=>{
    const d = e.key==="ArrowRight"?1 : e.key==="ArrowLeft"?-1 : 0;
    if(!d) return;
    e.preventDefault();
    const next=TABIDS[(i+d+TABIDS.length)%TABIDS.length];
    showTab(next); $(next).focus();
  });
});

/* ---------- diff ---------- */
let diffSha = "";

async function loadDiff(sha){
  if(sha !== undefined) diffSha = sha;
  const url = "/api/diff" + (diffSha ? "?sha=" + encodeURIComponent(diffSha) : "");
  const d = await (await fetch(url,{cache:"no-store"})).json();
  paintHistory(d.log||[]);
  $("diffLbl").textContent = d.label + (d.subject ? "  ·  " + d.subject : "");
  paintDiff(d.diff||"");
}

function paintHistory(log){
  const rail=$("histRail");
  rail.innerHTML='<h4>history</h4>';
  const mk=(label,sha,sub)=>{
    const b=document.createElement("button");
    b.setAttribute("aria-current", diffSha===sha);
    b.innerHTML=escapeHtml(label)+(sub?'<span class="n">'+escapeHtml(sub)+'</span>':"");
    b.onclick=()=>loadDiff(sha);
    rail.appendChild(b);
  };
  mk("Latest change","","");
  log.forEach(c=>mk(c.subject.slice(0,26), c.sha, c.when));
}

function paintDiff(text){
  if(!text.trim()){
    $("diffStat").textContent="";
    $("diffBody").innerHTML='<p class="none">Nothing changed here yet.</p>';
    return;
  }
  let add=0, del=0;
  const rows = text.split("\n").map(l=>{
    let cls="ctx";
    if(l.startsWith("+++")||l.startsWith("---")||l.startsWith("diff ")||l.startsWith("index ")) cls="meta";
    else if(l.startsWith("@@")) cls="hunk";
    else if(l.startsWith("+")){ cls="add"; add++; }
    else if(l.startsWith("-")){ cls="del"; del++; }
    return '<tr class="'+cls+'"><td class="tx">'+escapeHtml(l||" ")+'</td></tr>';
  });
  $("diffStat").innerHTML='<span class="plus">+'+add+'</span> <span class="minus">-'+del+'</span>';
  $("diffBody").innerHTML='<table class="difftable">'+rows.join("")+'</table>';
}

async function loadTicket(){
  const r=await (await fetch("/api/ticket",{cache:"no-store"})).json();
  $("ticketBody").innerHTML=marked.parse(r.ticket||"_No ticket for this problem._");
}

/* ---------- problem switcher ---------- */
let CURRENT=null;

function paintProblems(list,current){
  const box=$("probs"); box.innerHTML="";
  list.forEach(pr=>{
    const b=document.createElement("button");
    b.setAttribute("aria-current", pr.id===current);
    const num=pr.id.split("-")[0];
    b.innerHTML='<span class="num">'+num+'</span>'+escapeHtml(pr.title)
      +(pr.count?'<span class="badge">'+pr.count+'</span>':"");
    b.title=pr.id;
    b.onclick=()=>switchTo(pr.id);
    box.appendChild(b);
  });
}

async function switchTo(id){
  if(id===CURRENT) return;
  await fetch("/api/switch",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id})});
  sel=null;                      // reset the source rail for the new file
  lastCount=-1;                  // force a chat repaint
  await refresh();
}

/* ---------- theme: light / dark / system ---------- */
const THEMES=["system","light","dark"];
const ICON={system:"◐",light:"☀",dark:"☾"};
let theme="system";

function readTheme(){
  try{ const v=localStorage.getItem("ae-theme"); if(THEMES.includes(v)) return v; }catch(e){}
  return "system";
}
function applyTheme(){
  const r=document.documentElement;
  if(theme==="system") delete r.dataset.theme; else r.dataset.theme=theme;
  $("theme").innerHTML='<span class="ico">'+ICON[theme]+'</span>'+theme;
  try{ localStorage.setItem("ae-theme",theme); }catch(e){}
  syncFrameTheme();
}
// contentDocument and contentWindow both come back null from this frame, so the
// theme rides on the URL instead and the preview reads it on load.
function syncFrameTheme(){ reloadFrame(); }
$("theme").onclick=()=>{
  theme=THEMES[(THEMES.indexOf(theme)+1)%THEMES.length];
  applyTheme();
};


theme=readTheme(); applyTheme();
setMode("plan"); poll(); $("input").focus();
</script>
